apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: campus-complaint-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/paavana-410/campus_complaint.git'
    targetRevision: main
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
